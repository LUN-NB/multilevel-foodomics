pipeline_version: "4.3.1"
protocol: global_within_equal_complete_gpu_trial_4gb_fix_5x5

# Resolve paths from project root.
paths:
  model_config: configs/tuning/adaptive_phase2_4gb.yaml
  core_dir: src/cpi_mec
  splits_dir: reports/splits
  output_dir: reports/adaptive_pipeline_complete_gpu_trial_5x5

runtime:
  expected_python_prefix: "3.11"
  expected_optuna_version: "4.9.0"
  device: auto

# Complete coarse grid; zero values are ablations.
search:
  inner_folds: "1,2,3,4,5"
  seed_offsets: "0"
  anchor_values: "0.025,0.05,0.1,0.25,0.5,1,2"
  graphban_values: "0,0.25,0.5,1,2,4,8"
  boltz_values: "0,0.125,0.25,0.5,1,2,4"
  model_batch_size: 32

# The coarse winner defines local bounds; 64 new trials exclude the injected point.
continuous_tpe:
  model_batch_size: 10
  trials: 64
  startup_trials: 12
  ei_candidates: 24
  sampler_seed: 20260725
  study_name: cpi_mec_dynamic_local_tpe

# Tune and refit each M1 outer fold independently.
m1:
  outer_repeats: 5
  outer_folds: 5
  seed_offsets: "0"
  row_chunk_size: 16

# Final uses one all-label five-fold OOF search.
final_search:
  split_repeat: 1

final:
  seed_offsets: "0"
  final_seed_offset: 9000000
  row_chunk_size: 16

training:
  backbone_epochs: 30
  steps_per_epoch: 100
  head_epochs: 120

# M1 performance uses strict outer OOF; Final label metrics are descriptive only.
evaluation:
  m0_matrix: data/raw/unidock/UniDock_original_scores_matrix.csv
  labels: data/project/labels/benchmark_labels.csv
  descriptors: data/curated/reference/rdkit_descriptors_grouped.csv
  folds: 5
  repeats: 5
  seed: 20260711
  global_top_fraction: 0.05
  target_top_k: 100

